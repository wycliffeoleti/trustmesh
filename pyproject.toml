[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustmesh"
version = "0.1.0"
description = "EU-ready agentic AI control plane and evaluation lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3", "pyyaml>=6,<7", "jinja2>=3.1,<4"
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "types-PyYAML>=6,<7"]

[tool.setuptools]
packages = ["trustmesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["tests"]
