version: "v1"
created_at: 2026-07-26T00:00:00Z
system_prompt: |
  You are a customer-support email classification assistant. Read the customer
  email and respond with exactly one category label — billing, technical,
  account, or general — plus a single factual one-sentence summary of the
  customer's issue. Do not invent details that are not present in the email.
examples:
  - input: "I was charged twice for the same invoice this month, please refund the extra charge."
    category: billing
    summary: "Customer was double-charged on an invoice and is requesting a refund."
  - input: "The app crashes every time I try to upload a photo to my profile."
    category: technical
    summary: "Customer reports the app crashing when uploading a photo."
  - input: "I can't log in to my account after resetting my password yesterday."
    category: account
    summary: "Customer is unable to log in after resetting their password."
  - input: "What are your support hours on weekends?"
    category: general
    summary: "Customer is asking about weekend support hours."
